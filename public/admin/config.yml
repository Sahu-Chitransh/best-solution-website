backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "hero"
    label: "Hero Slides"
    files:
      - file: "src/content/hero.json"
        label: "Hero Content"
        name: "hero"
        fields:
          - {label: "Autoplay Interval (ms)", name: "autoplayInterval", widget: "number", default: 5000}
          - name: "slides"
            label: "Banner Slides"
            widget: "list"
            fields:
              - {label: "Slide ID", name: "id", widget: "number"}
              - {label: "Banner Image", name: "image", widget: "image"}
              - {label: "Alt Text / Description", name: "alt", widget: "string"}

  - name: "stats"
    label: "Stats"
    files:
      - file: "src/content/stats.json"
        label: "Stats"
        name: "stats"
        fields:
          - name: "stats"
            label: "Stats"
            widget: "list"
            fields:
              - {label: "Value", name: "value", widget: "string"}
              - {label: "Label", name: "label", widget: "string"}

  - name: "marquee"
    label: "Marquee"
    files:
      - file: "src/content/marquee.json"
        label: "Marquee"
        name: "marquee"
        fields:
          - name: "items"
            label: "Items"
            widget: "list"
            field: {name: "item", label: "Item", widget: "string"}

  - name: "courses"
    label: "Courses (Goals & Programs)"
    files:
      - file: "src/content/courses.json"
        label: "Courses"
        name: "courses"
        fields:
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "Subheading", name: "subheading", widget: "string"}
          - name: "goals"
            label: "Goals (Doctor, Engineer, 6-10th)"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Badge", name: "badge", widget: "string"}
              - {label: "Accent Color", name: "accentColor", widget: "color"}
              - {label: "Description", name: "description", widget: "text"}
              - name: "programs"
                label: "Programs"
                widget: "list"
                fields:
                  - {label: "Slug", name: "slug", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Grade / Duration", name: "grade", widget: "string"}
                  - {label: "Tagline", name: "tagline", widget: "string"}
                  - {label: "Exams / Focus", name: "exams", widget: "list", field: {name: "exam", label: "Exam", widget: "string"}}
                  - {label: "Features / Highlights", name: "features", widget: "list", field: {name: "feature", label: "Feature", widget: "string"}}
                  - {label: "Color", name: "color", widget: "color"}
                  - {label: "Color Dark", name: "colorDark", widget: "color"}

  - name: "admissions"
    label: "Admissions"
    files:
      - file: "src/content/admissions.json"
        label: "Admissions"
        name: "admissions"
        fields:
          - {label: "Session Year", name: "sessionYear", widget: "string"}
          - name: "steps"
            label: "Steps"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "string"}
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "string"}
              - {label: "Icon", name: "icon", widget: "string"}
          - name: "documents"
            label: "Documents"
            widget: "list"
            field: {name: "document", label: "Document", widget: "string"}
          - name: "keyDates"
            label: "Key Dates"
            widget: "object"
            fields:
              - {label: "Registration Opens", name: "registrationOpens", widget: "string"}
              - {label: "Scholarship Test", name: "scholarshipTest", widget: "string"}
              - {label: "Batch Commences", name: "batchCommences", widget: "string"}

  - name: "testimonials"
    label: "Testimonials"
    files:
      - file: "src/content/testimonials.json"
        label: "Testimonials"
        name: "testimonials"
        fields:
          - name: "testimonials"
            label: "Testimonials"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Tag", name: "tag", widget: "string"}
              - {label: "Quote", name: "quote", widget: "text"}
              - {label: "Initials", name: "initials", widget: "string"}
              - {label: "Image", name: "image", widget: "image", required: false}

  - name: "results"
    label: "Results"
    files:
      - file: "src/content/results.json"
        label: "Results"
        name: "results"
        fields:
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "Subheading", name: "subheading", widget: "text"}
          - name: "stats"
            label: "Stats"
            widget: "list"
            fields:
              - {label: "Value", name: "value", widget: "string"}
              - {label: "Label", name: "label", widget: "string"}
          - name: "spotlights"
            label: "Top Spotlight Achievers"
            widget: "list"
            fields:
              - {label: "Student Name", name: "name", widget: "string"}
              - {label: "Exam", name: "exam", widget: "string"}
              - {label: "Rank / Score", name: "rank", widget: "string"}
              - {label: "Tag", name: "tag", widget: "string"}
              - {label: "Batch", name: "batch", widget: "string"}
              - {label: "Image Card", name: "image", widget: "image"}
              - {label: "Badge Text", name: "badge", widget: "string"}
              - {label: "Accent Color", name: "accent", widget: "color"}
          - name: "jee"
            label: "JEE Posters"
            widget: "list"
            field: {name: "image", label: "Image", widget: "image"}
          - name: "neet"
            label: "NEET Posters"
            widget: "list"
            field: {name: "image", label: "Image", widget: "image"}

  - name: "blog"
    label: "Blog"
    files:
      - file: "src/content/blog.json"
        label: "Blog"
        name: "blog"
        fields:
          - name: "posts"
            label: "Posts"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "number"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Snippet", name: "snippet", widget: "text"}
              - {label: "Category", name: "category", widget: "select", options: ["IIT-JEE", "NEET", "CCG", "OLYMPIAD", "BOARDS", "WELLNESS"]}
              - {label: "Date", name: "date", widget: "string"}
              - {label: "Read Time", name: "readTime", widget: "string"}
              - {label: "Author", name: "author", widget: "string", required: false}
              - {label: "Author Role", name: "authorRole", widget: "string", required: false}
              - {label: "BgColor", name: "bgColor", widget: "select", options: ["bg-slate-200", "bg-blue-100", "bg-amber-100", "bg-rose-100", "bg-emerald-100", "bg-violet-100", "bg-orange-100", "bg-sky-100", "bg-pink-100", "bg-teal-100", "bg-red-100", "bg-amber-50", "bg-emerald-50", "bg-rose-50", "bg-violet-50", "bg-cyan-50", "bg-orange-50"]}
              - {label: "Image", name: "image", widget: "image", required: false}
              - name: "keyTakeaways"
                label: "Key Takeaways"
                widget: "list"
                required: false
                field: {name: "takeaway", label: "Takeaway", widget: "string"}
              - name: "content"
                label: "Article Content"
                widget: "list"
                required: false
                fields:
                  - {label: "Section Heading", name: "heading", widget: "string"}
                  - name: "paragraphs"
                    label: "Paragraphs"
                    widget: "list"
                    field: {name: "paragraph", label: "Paragraph", widget: "text"}
          - name: "news"
            label: "News"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "string"}
              - {label: "Category", name: "category", widget: "string"}
              - {label: "Tag", name: "tag", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Snippet", name: "snippet", widget: "text"}
              - {label: "Date", name: "date", widget: "string"}
              - {label: "Source", name: "source", widget: "string"}
              - {label: "Source URL", name: "sourceUrl", widget: "string"}
              - {label: "Image", name: "image", widget: "image", required: false}
              - {label: "Is Hot", name: "isHot", widget: "boolean"}
          - name: "newspaperCuttings"
            label: "Newspaper Cuttings"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Caption", name: "caption", widget: "string"}
              - {label: "Source", name: "source", widget: "string"}

  - name: "contact"
    label: "Contact"
    files:
      - file: "src/content/contact.json"
        label: "Contact"
        name: "contact"
        fields:
          - {label: "Address", name: "address", widget: "string"}
          - name: "phones"
            label: "Phones"
            widget: "list"
            field: {name: "phone", label: "Phone", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - name: "instagram"
            label: "Instagram"
            widget: "object"
            fields:
              - {label: "Handle", name: "handle", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
          - {label: "Map Embed", name: "mapEmbed", widget: "string"}
          - {label: "Map Address", name: "mapAddress", widget: "string"}

  - name: "brochure"
    label: "Brochure"
    files:
      - file: "src/content/brochure.json"
        label: "Brochure"
        name: "brochure"
        fields:
          - {label: "Session Label", name: "sessionLabel", widget: "string"}
          - {label: "Image", name: "image", widget: "image"}
          - {label: "Description", name: "description", widget: "text"}

  - name: "about"
    label: "About"
    files:
      - file: "src/content/about.json"
        label: "About"
        name: "about"
        fields:
          - name: "images"
            label: "About Showcase Images"
            widget: "list"
            field: {label: "Image", name: "image", widget: "image"}
          - name: "values"
            label: "Values"
            widget: "list"
            fields:
              - {label: "Icon", name: "icon", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "string"}
          - name: "timeline"
            label: "Timeline"
            widget: "list"
            fields:
              - {label: "Year", name: "year", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "string"}

  - name: "settings"
    label: "Site Settings"
    files:
      - file: "src/content/settings.json"
        label: "Settings"
        name: "settings"
        fields:
          - {label: "Phone", name: "phone", widget: "string"}
          - {label: "Phone Link", name: "phoneLink", widget: "string"}
          - {label: "Session Year", name: "sessionYear", widget: "string"}
          - {label: "Logo", name: "logo", widget: "image"}
          - name: "gradeOptions"
            label: "Grade Options"
            widget: "list"
            field: {name: "grade", label: "Grade", widget: "string"}
          - name: "courseOptions"
            label: "Course Options"
            widget: "list"
            field: {name: "course", label: "Course", widget: "string"}

  - name: "instagram"
    label: "Instagram Gallery"
    files:
      - file: "src/content/instagram.json"
        label: "Instagram Gallery"
        name: "instagram"
        fields:
          - {label: "Section Title", name: "sectionTitle", widget: "string"}
          - {label: "Handle", name: "handle", widget: "string"}
          - {label: "Profile URL", name: "profileUrl", widget: "string"}
          - name: "posts"
            label: "Posts"
            widget: "list"
            fields:
              - {label: "Image", name: "image", widget: "image", required: false, hint: "Leave empty to auto-fetch from Instagram URL"}
              - {label: "Caption", name: "caption", widget: "text", required: false, hint: "Leave empty to auto-fetch from Instagram"}
              - {label: "Instagram URL", name: "instagramUrl", widget: "string"}
              - {label: "Date", name: "date", widget: "string"}
              - {label: "Featured on Homepage", name: "featured", widget: "boolean", default: false}
              - {label: "Fetched Image", name: "fetchedImage", widget: "hidden", required: false}
              - {label: "Fetched Caption", name: "fetchedCaption", widget: "hidden", required: false}
